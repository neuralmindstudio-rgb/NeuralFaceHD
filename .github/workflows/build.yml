name: Build APK Neural Face HD

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev libssl-dev python3-dev zip unzip
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools appdirs packaging colorama jinja2 six toml sh build wheel

      - name: Limpar compilacao anterior
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      

      - name: Gerar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          BUILD_EXIT=${PIPESTATUS[0]}
          exit $BUILD_EXIT

      - name: Mostrar resultado
        if: always()
        run: |
          echo "===== ARQUIVOS GERADOS ====="
          ls -lah bin/ || true

          echo "===== ERROS ENCONTRADOS ====="
          grep -inE "error:|error |ERROR|failed|FAILED|exception|traceback" build.log | tail -n 100 || true

          echo "===== FINAL DO LOG ====="
          tail -n 300 build.log || true

      - name: Salvar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-APK
          path: bin/*.apk
          if-no-files-found: error
      
