name: Build APK Neural Face HD

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            python3-dev \
            zip \
            unzip \
            git \
            ccache

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip

          python -m pip install \
            "setuptools<70" \
            "cython==0.29.36" \
            buildozer \
            appdirs \
            packaging \
            colorama \
            jinja2 \
            six \
            toml \
            "sh<3" \
            wheel

      - name: Preparar ambiente Android
        run: |
          echo "P4A_COMMIT=v2024.01.21" >> $GITHUB_ENV

          python -m pip uninstall -y cython || true
          python -m pip install "cython==0.29.36"

          echo "===== VERSÕES DO AMBIENTE ====="
          python --version
          cython --version
          buildozer --version

      - name: Limpar compilacao anterior
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Verificar ambiente
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== PIP ====="
          pip --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== BUILDOZER ====="
          buildozer --version

          echo "===== JAVA ====="
          java -version

      - name: Gerar APK
        env:
          ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
          ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk
          ANDROIDNDK: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
          ANDROIDAPI: "35"
          ANDROIDMINAPI: "21"
        run: |
          set -o pipefail

          echo "========================================"
          echo "       GERANDO NEURAL FACE HD"
          echo "========================================"

          buildozer -v android debug 2>&1 | tee build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          echo ""
          echo "========================================"
          echo "       RESULTADO DA COMPILACAO"
          echo "========================================"

          if [ "$BUILD_EXIT" -eq 0 ]; then
            echo "APK gerado com sucesso!"
          else
            echo "A compilacao falhou."
          fi

          exit $BUILD_EXIT

      - name: Mostrar resultado
        if: always()
        run: |
          echo "========================================"
          echo "       ARQUIVOS GERADOS"
          echo "========================================"

          ls -lah bin/ || true

          echo ""
          echo "========================================"
          echo "       ERROS ENCONTRADOS"
          echo "========================================"

          grep -inE \
            "error:|error |ERROR|failed|FAILED|exception|traceback|HTTP Error" \
            build.log | tail -n 150 || true

          echo ""
          echo "========================================"
          echo "       FINAL DO LOG"
          echo "========================================"

          tail -n 300 build.log || true

      - name: Salvar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-APK
          path: bin/*.apk
          if-no-files-found: error
      
