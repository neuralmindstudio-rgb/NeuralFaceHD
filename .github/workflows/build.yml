name: Build APK e AAB - Neural Face HD

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libffi-dev python3-dev
          python -m pip install --upgrade pip
          pip install buildozer cython==0.29.33 setuptools appdirs packaging colorama jinja2 six toml sh build wheel

      - name: Force Clean Cache & Old Builds
        run: |
          rm -rf .buildozer
          rm -rf bin/

      - name: Build App (Debug APK ou Release AAB)
        run: |
          # Executa o buildozer (lembrando que no seu spec está setado para aab, ou mude se preferir apk)
          yes | buildozer -v android debug
        env:
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

      - name: List files in bin to debug
        if: always()
        run: |
          ls -la bin/ || true

      - name: Upload Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-Binarios
          path: bin/
      
