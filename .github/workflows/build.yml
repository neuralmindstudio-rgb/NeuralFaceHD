name: Build APK Neural Face HD

on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            python3-dev \
            zip \
            unzip \
            git \
            pkg-config

      - name: Instalar dependencias Python
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install \
            buildozer \
            cython==0.29.33 \
            appdirs \
            packaging \
            colorama \
            jinja2 \
            six \
            toml \
            sh

      - name: Limpar compilacao anterior
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Verificar ambiente
        run: |
          echo "===== PYTHON ====="
          python --version

          echo "===== PIP ====="
          pip --version

          echo "===== CYTHON ====="
          cython --version

          echo "===== BUILDOZER ====="
          buildozer --version

      - name: Gerar APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
          ANDROID_NDK_ROOT: /home/runner/.buildozer/android/platform/android-ndk-r25b
        run: |
          set -o pipefail

          echo "===== PRIMEIRA TENTATIVA ====="

          if buildozer -v android debug 2>&1 | tee build.log; then
            echo "APK gerado com sucesso na primeira tentativa."
            exit 0
          fi

          echo ""
          echo "===== PRIMEIRA TENTATIVA FALHOU ====="
          echo "Aguardando 15 segundos antes de tentar novamente..."
          sleep 15

          echo ""
          echo "===== SEGUNDA TENTATIVA ====="

          buildozer -v android debug 2>&1 | tee -a build.log

          BUILD_EXIT=${PIPESTATUS[0]}

          exit $BUILD_EXIT

      - name: Salvar log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-Build-Log
          path: build.log
          if-no-files-found: warn

      - name: Salvar APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-APK
          path: bin/*.apk
          if-no-files-found: error
      
