```yaml
name: Build APK - Neural Face HD

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libffi-dev \
            libssl-dev \
            python3-dev \
            zip \
            unzip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            buildozer \
            cython==0.29.33 \
            setuptools \
            appdirs \
            packaging \
            colorama \
            jinja2 \
            six \
            toml \
            sh \
            build \
            wheel

      - name: Clean previous builds
        run: |
          rm -rf .buildozer
          rm -rf bin
          mkdir -p bin

      - name: Build APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Show build result
        if: always()
        run: |
          echo "======================================"
          echo "ARQUIVOS GERADOS"
          echo "======================================"
          ls -lah bin/ || true

          echo ""
          echo "======================================"
          echo "ÚLTIMAS 150 LINHAS DO LOG"
          echo "======================================"
          tail -n 150 build.log || true

          echo ""
          echo "======================================"
          echo "ERROS ENCONTRADOS"
          echo "======================================"
          grep -iE "error|exception|failed|failure|traceback" build.log | tail -n 100 || true

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-APK
          path: bin/*.apk
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuralFaceHD-Build-Log
          path: build.log
```


      
